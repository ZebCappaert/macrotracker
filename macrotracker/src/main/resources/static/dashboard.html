<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <title>Macro Tracker - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 font-sans min-h-screen p-6">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">Macro Dashboard</h1>
            <a href="/logout"
                class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Uitloggen</a>
        </div>

        <!-- Datum Kiezer (Netjes bovenaan) -->
        <div class="bg-white p-4 rounded-xl shadow-md mb-8 flex items-center justify-between">
            <label class="font-semibold text-slate-700" for="datePicker">Selecteer Datum:</label>
            <input type="date" id="datePicker"
                class="border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Doelen / Totaal Overzicht Kaart -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-8 grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
            <div class="bg-slate-50 p-4 rounded-lg">
                <p class="text-xs text-slate-500 uppercase font-semibold">Calorieën</p>
                <p class="text-2xl font-bold text-blue-600"><span id="totalCalories">0</span> <span
                        class="text-sm font-normal text-slate-400">/ <span id="targetCalories">0</span></span></p>
            </div>
            <div class="bg-slate-50 p-4 rounded-lg">
                <p class="text-xs text-slate-500 uppercase font-semibold">Eiwitten</p>
                <p class="text-2xl font-bold text-emerald-600"><span id="totalProtein">0</span>g <span
                        class="text-sm font-normal text-slate-400">/ <span id="targetProtein">0</span>g</span></p>
            </div>
            <div class="bg-slate-50 p-4 rounded-lg">
                <p class="text-xs text-slate-500 uppercase font-semibold">Koolhydraten</p>
                <p class="text-2xl font-bold text-amber-600"><span id="totalCarbs">0</span>g <span
                        class="text-sm font-normal text-slate-400">/ <span id="targetCarbs">0</span>g</span></p>
            </div>
            <div class="bg-slate-50 p-4 rounded-lg">
                <p class="text-xs text-slate-500 uppercase font-semibold">Vetten</p>
                <p class="text-2xl font-bold text-purple-600"><span id="totalFat">0</span>g <span
                        class="text-sm font-normal text-slate-400">/ <span id="targetFat">0</span>g</span></p>
            </div>
        </div>

        <!-- Grid voor Formulieren -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">

            <!-- Formulier: Voedsel Loggen -->
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h3 class="text-xl font-semibold text-slate-700 mb-4">Voeding Loggen</h3>
                <form id="logForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1" for="foodSelect">Product:</label>
                        <select id="foodSelect" required
                            class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1" for="amount">Aantal gram:</label>
                        <input type="number" id="amount" required value="100"
                            class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-2.5 rounded-lg transition text-sm">Toevoegen</button>
                </form>
            </div>

            <!-- Formulier: Nieuw Product Aanmaken -->
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h3 class="text-xl font-semibold text-slate-700 mb-4">Nieuw Product</h3>
                <form id="foodForm" class="space-y-3">
                    <input type="text" id="newName" placeholder="Productnaam" required
                        class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" step="0.1" id="newCal" placeholder="Kcal/100g" required
                            class="border border-slate-300 rounded-lg p-2 text-sm">
                        <input type="number" step="0.1" id="newPro" placeholder="Eiwit/100g" required
                            class="border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" step="0.1" id="newCarb" placeholder="Koolh/100g" required
                            class="border border-slate-300 rounded-lg p-2 text-sm">
                        <input type="number" step="0.1" id="newFat" placeholder="Vet/100g" required
                            class="border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <button type="submit"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium p-2.5 rounded-lg transition text-sm">Product
                        Opslaan</button>
                </form>
            </div>

            <!-- Formulier: Doelen Instellen -->
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h3 class="text-xl font-semibold text-slate-700 mb-4">Mijn Doelen</h3>
                <form id="goalForm" class="space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="targetCalInput" placeholder="Doel Kcal" required
                            class="border border-slate-300 rounded-lg p-2 text-sm">
                        <input type="number" id="targetProInput" placeholder="Doel Eiwit" required
                            class="border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="targetCarbInput" placeholder="Doel Koolh." required
                            class="border border-slate-300 rounded-lg p-2 text-sm">
                        <input type="number" id="targetFatInput" placeholder="Doel Vet" required
                            class="border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <button type="submit"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium p-2.5 rounded-lg transition text-sm">Doelen
                        Opslaan</button>
                </form>
            </div>

        </div>

        <!-- Overzicht tabel -->
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h3 class="text-xl font-semibold text-slate-700 mb-4">Mijn Inname</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-500 text-sm">
                            <th class="pb-3 font-semibold">Product</th>
                            <th class="pb-3 font-semibold">Hoeveelheid</th>
                            <th class="pb-3 font-semibold">Calorieën</th>
                            <th class="pb-3 font-semibold">Eiwit</th>
                            <th class="pb-3 font-semibold">Koolh.</th>
                            <th class="pb-3 font-semibold">Vet</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody" class="divide-y divide-slate-100 text-slate-700">
                        <!-- Wordt gevuld door JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const datePicker = document.getElementById('datePicker');
        datePicker.valueAsDate = new Date();

        datePicker.addEventListener('change', () => {
            loadLogs();
        });

        async function loadUserProfile() {
            try {
                const response = await fetch('/api/user/profile');
                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('targetCalories').textContent = user.targetCalories;
                    document.getElementById('targetProtein').textContent = user.targetProtein;
                    document.getElementById('targetCarbs').textContent = user.targetCarbs;
                    document.getElementById('targetFat').textContent = user.targetFat;

                    document.getElementById('targetCalInput').value = user.targetCalories;
                    document.getElementById('targetProInput').value = user.targetProtein;
                    document.getElementById('targetCarbInput').value = user.targetCarbs;
                    document.getElementById('targetFatInput').value = user.targetFat;
                }
            } catch (error) {
                console.error('Fout bij ophalen profiel:', error);
            }
        }

        async function loadFoodItems() {
            try {
                const response = await fetch('/api/food');
                if (response.ok) {
                    const foods = await response.json();
                    const select = document.getElementById('foodSelect');
                    select.innerHTML = '';
                    foods.forEach(food => {
                        const option = document.createElement('option');
                        option.value = food.id;
                        option.textContent = `${food.name} (${food.caloriesPer100g} kcal/100g)`;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Fout bij laden producten:', error);
            }
        }

        async function loadLogs() {
            const selectedDate = datePicker.value;
            try {
                const response = await fetch(`/api/logs?date=${selectedDate}`);
                if (response.ok) {
                    const logs = await response.json();
                    const tbody = document.getElementById('logTableBody');
                    tbody.innerHTML = '';

                    let totalCal = 0, totalPro = 0, totalCarb = 0, totalFat = 0;

                    if (logs.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" class="py-4 text-center text-slate-400">Nog geen voeding gelogd op deze datum.</td></tr>`;
                    }

                    logs.forEach(log => {
                        const factor = log.amountInGrams / 100;
                        const kcals = log.foodItem.caloriesPer100g * factor;
                        const protein = log.foodItem.proteinPer100g * factor;
                        const carbs = log.foodItem.carbsPer100g * factor;
                        const fat = log.foodItem.fatPer100g * factor;

                        totalCal += kcals;
                        totalPro += protein;
                        totalCarb += carbs;
                        totalFat += fat;

                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td class="py-3 font-medium">${log.foodItem.name}</td>
                            <td class="py-3">${log.amountInGrams}g</td>
                            <td class="py-3">${Math.round(kcals)} kcal</td>
                            <td class="py-3">${Math.round(protein)}g</td>
                            <td class="py-3">${Math.round(carbs)}g</td>
                            <td class="py-3">${Math.round(fat)}g</td>
                        `;
                        tbody.appendChild(row);
                    });

                    document.getElementById('totalCalories').textContent = Math.round(totalCal);
                    document.getElementById('totalProtein').textContent = Math.round(totalPro);
                    document.getElementById('totalCarbs').textContent = Math.round(totalCarb);
                    document.getElementById('totalFat').textContent = Math.round(totalFat);
                }
            } catch (error) {
                console.error('Fout bij ophalen logs:', error);
            }
        }

        document.getElementById('logForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const foodItemId = document.getElementById('foodSelect').value;
            const amountInGrams = document.getElementById('amount').value;

            const response = await fetch('/api/logs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ foodItemId: Number(foodItemId), amountInGrams: Number(amountInGrams) })
            });

            if (response.ok) {
                loadLogs();
            } else {
                alert('Fout bij toevoegen!');
            }
        });

        document.getElementById('foodForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('newName').value;
            const caloriesPer100g = document.getElementById('newCal').value;
            const proteinPer100g = document.getElementById('newPro').value;
            const carbsPer100g = document.getElementById('newCarb').value;
            const fatPer100g = document.getElementById('newFat').value;

            const response = await fetch('/api/food', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, caloriesPer100g: Number(caloriesPer100g), proteinPer100g: Number(proteinPer100g), carbsPer100g: Number(carbsPer100g), fatPer100g: Number(fatPer100g) })
            });

            if (response.ok) {
                document.getElementById('foodForm').reset();
                loadFoodItems();
                alert('Product toegevoegd!');
            }
        });

        document.getElementById('goalForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const targetCalories = document.getElementById('targetCalInput').value;
            const targetProtein = document.getElementById('targetProInput').value;
            const targetCarbs = document.getElementById('targetCarbInput').value;
            const targetFat = document.getElementById('targetFatInput').value;

            const response = await fetch('/api/user/goals', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    targetCalories: Number(targetCalories),
                    targetProtein: Number(targetProtein),
                    targetCarbs: Number(targetCarbs),
                    targetFat: Number(targetFat)
                })
            });

            if (response.ok) {
                loadUserProfile();
                alert('Doelen bijgewerkt!');
            } else {
                alert('Fout bij bijwerken doelen!');
            }
        });

        loadUserProfile();
        loadFoodItems();
        loadLogs();
    </script>

</body>

</html>
